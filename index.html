<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word Checker</title>
    <link rel="stylesheet" href="main.css">
</head>
<body>
    <main class="checker">
        <header>
            <h1>Word Checker</h1>
            <p>Type a word to see its SOWPODS neighbours, then press Check for its definition.</p>
        </header>

        <p id="dictionary-status" role="status">Loading dictionary...</p>
        <div id="file-choice" hidden>
            <label for="dictionary-file">Choose the local sowpods.txt file:</label>
            <input id="dictionary-file" type="file" accept=".txt,text/plain">
        </div>

        <form id="check-form">
            <label for="word">Word</label>
            <div class="search">
                <input id="word" name="word" type="text" autocomplete="off"
                    autocapitalize="characters" spellcheck="false" autofocus required>
                <button id="check-button" type="submit" disabled>Check</button>
            </div>
        </form>

        <p id="result" class="result" role="status" aria-live="polite"></p>
        <div id="details" class="details">
            <section id="neighbours" aria-labelledby="neighbours-heading" hidden>
                <h2 id="neighbours-heading">Nearby words</h2>
                <ol id="word-list" aria-label="Dictionary entries around the checked word"></ol>
            </section>
            <section id="definition" aria-labelledby="definition-heading" hidden>
                <h2 id="definition-heading">Definition</h2>
                <div class="definition-panel">
                    <p id="definition-text" role="status" aria-live="polite"></p>
                    <p id="definition-credit" class="definition-credit" hidden>
                        Sources: <a id="wiktionary-source" href="https://en.wiktionary.org/" target="_blank" rel="noopener noreferrer">Wiktionary contributors</a>
                        (<a href="https://creativecommons.org/licenses/by-sa/4.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 4.0</a>),
                        and <a href="https://dictionaryapi.dev/" target="_blank" rel="noopener noreferrer">Free Dictionary API</a>
                        (<a href="https://creativecommons.org/licenses/by-sa/3.0/" target="_blank" rel="noopener noreferrer">CC BY-SA 3.0</a>).
                        <a id="definition-source" href="https://dictionaryapi.dev/" target="_blank" rel="noopener noreferrer">API entry details</a>.
                    </p>
                </div>
            </section>
        </div>
    </main>
    <script src="main.js" defer></script>
</body>
</html>
